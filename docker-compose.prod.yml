version: '3.8'

services:
  backend:
    # Replace ${DOCKER_USERNAME} with your actual username in the .env file or export it
    image: vanujak/wedding-backend:latest
    restart: always
    env_file:
      - .env
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: ${DB_SSL:-true}
    ports:
      - "4000:4000"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    image: vanujak/wedding-frontend:latest
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend
